services:
  ollama:
    image: ollama/ollama:0.20.2
    restart: unless-stopped
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_MAX_LOADED_MODELS: "1"
      OLLAMA_CONTEXT_LENGTH: "8192"
    volumes:
      - ollama_models:/root/.ollama
      - ./install-model.sh:/setup/install-model.sh:ro
    gpus: all
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 15s
      timeout: 5s
      retries: 10
  gateway:
    image: python:3.12-slim
    restart: unless-stopped
    working_dir: /app
    command: ["python", "-u", "gateway.py"]
    environment:
      OLLAMA_URL: http://ollama:11434
      MODEL_GATEWAY_KEY_FILE: /run/secrets/model_gateway_key
    secrets:
      - model_gateway_key
    volumes:
      - ./gateway.py:/app/gateway.py:ro
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      ollama:
        condition: service_healthy
  https:
    image: caddy:2-alpine
    profiles: ["https"]
    restart: unless-stopped
    environment:
      MODEL_DOMAIN: ${MODEL_DOMAIN:-}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - gateway
volumes:
  ollama_models:
  caddy_data:
  caddy_config:
secrets:
  model_gateway_key:
    file: ./secrets/model_gateway_key
